<?xml version='1.0' encoding='utf-8'?>
<svg aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
  <title id="title">FHIR federation and data coordination</title>
  <desc id="desc">A proposed placement-aware query broker and separate bulk workers share a catalog within one federation. Independent FHIR servers search, ingest and export locally. A client can read a returned fullUrl directly. Bulk files move between the shards and object storage.</desc>
  <rect x="0" y="0" width="1600" height="900" fill="#F8FAFC" />
  <text x="55" y="43" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#41596C">AZURE HEALTH DATA SERVICES     /     FEDERATED FHIR</text>
  <rect x="1330" y="23" width="215" height="35" rx="17" fill="#EAF1F5" stroke="#A9BBC7" stroke-width="1.5" />
  <text x="1353" y="46" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#142B40">PROPOSED ARCHITECTURE</text>
  <text x="53" y="115" font-family="Segoe UI,Arial,sans-serif" font-size="52" font-weight="600" fill="#142B40">FHIR federation &amp; data coordination</text>
  <text x="55" y="155" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#41596C">One federation coordinates searches and bulk jobs. Each FHIR server owns its data and indexes.</text>
  <rect x="343" y="235" width="727" height="447" rx="15" fill="none" stroke="#8196AA" stroke-width="2" />
  <text x="365" y="270" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#142B40">FEDERATION SERVICE</text>
  <polyline points="177,295 177,207 1389,207 1389,240" stroke="#725596" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" />
  <polygon points="1389.00,240.00 1384.38,231.13 1393.62,231.13" fill="#725596" />
  <text x="541" y="199" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#725596">Direct read: the client follows a resource’s fullUrl to its shard</text>
  <polyline points="292,324 673,324" stroke="#2563A4" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" />
  <polygon points="673.00,324.00 664.13,328.62 664.13,319.38" fill="#2563A4" />
  <polygon points="292.00,324.00 300.87,319.38 300.87,328.62" fill="#2563A4" />
  <text x="379" y="312" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#2563A4">Search request / merged results</text>
  <polyline points="177,451 177,651 846,651 846,618" stroke="#087970" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" />
  <polygon points="846.00,618.00 850.62,626.87 841.38,626.87" fill="#087970" />
  <polygon points="177.00,451.00 181.62,459.87 172.38,459.87" fill="#087970" />
  <text x="196" y="640" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#087970">Submit job / get status or export manifest</text>
  <rect x="55" y="295" width="239" height="156" rx="12" fill="#F1F7FD" stroke="#2563A4" stroke-width="1.5" />
  <text x="76" y="326" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#2563A4">CALLER</text>
  <text x="75" y="365" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="600" fill="#142B40">FHIR client</text>
  <text x="76" y="399" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#41596C">Runs searches and</text>
  <text x="76" y="425" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#41596C">submits bulk jobs.</text>
  <rect x="366" y="382" width="251" height="181" rx="12" fill="#FFFBF2" stroke="#865B1C" stroke-width="1.5" />
  <text x="384" y="411" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#865B1C">SHARD MANAGEMENT</text>
  <text x="383" y="447" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" fill="#142B40">Placement catalog</text>
  <text x="384" y="479" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#41596C">Tracks participating shards,</text>
  <text x="384" y="504" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#41596C">partition owners and rules</text>
  <text x="384" y="529" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#41596C">for placing new data.</text>
  <polyline points="617,471 644,471" stroke="#865B1C" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" />
  <polyline points="644,471 644,357 673,357" stroke="#865B1C" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" />
  <polygon points="673.00,357.00 664.13,361.62 664.13,352.38" fill="#865B1C" />
  <polyline points="644,471 673,471" stroke="#865B1C" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" />
  <polygon points="673.00,471.00 664.13,475.62 664.13,466.38" fill="#865B1C" />
  <polyline points="644,471 644,557 673,557" stroke="#865B1C" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" />
  <polygon points="673.00,557.00 664.13,561.62 664.13,552.38" fill="#865B1C" />
  <rect x="678" y="281" width="370" height="108" rx="12" fill="#F1F7FD" stroke="#2563A4" stroke-width="1.5" />
  <text x="698" y="306" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#2563A4">INTERACTIVE REQUESTS</text>
  <text x="697" y="339" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="600" fill="#142B40">Query broker</text>
  <text x="698" y="370" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#41596C">Choose shards, run searches, merge results.</text>
  <rect x="678" y="411" width="370" height="207" rx="12" fill="#EFF9F6" stroke="#087970" stroke-width="1.5" />
  <text x="698" y="437" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#087970">BULK WORKERS  /  SEPARATE FROM SEARCH</text>
  <text x="697" y="470" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#142B40">Ingest coordinator</text>
  <text x="698" y="495" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#41596C">Group input by owner; dispatch shard imports.</text>
  <polyline points="698,515 1028,515" stroke="#CBD7DF" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round" />
  <text x="697" y="549" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#142B40">Export coordinator</text>
  <text x="698" y="574" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#41596C">Track shard exports; publish one file manifest.</text>
  <text x="698" y="601" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#087970">Shared job queue and durable job status</text>
  <polyline points="1048,328 1231,328" stroke="#2563A4" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" />
  <polygon points="1231.00,328.00 1222.13,332.62 1222.13,323.38" fill="#2563A4" />
  <polygon points="1048.00,328.00 1056.87,323.38 1056.87,332.62" fill="#2563A4" />
  <text x="1082" y="315" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#2563A4">Query / results</text>
  <polyline points="1048,475 1231,475" stroke="#087970" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" />
  <polygon points="1231.00,475.00 1222.13,479.62 1222.13,470.38" fill="#087970" />
  <text x="1101" y="462" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#087970">Run import</text>
  <polyline points="1048,555 1231,555" stroke="#087970" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" />
  <polygon points="1231.00,555.00 1222.13,559.62 1222.13,550.38" fill="#087970" />
  <text x="1102" y="542" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#087970">Run export</text>
  <rect x="1235" y="240" width="310" height="365" rx="14" fill="#FFFFFF" stroke="#2563A4" stroke-width="1.5" />
  <text x="1255" y="270" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#2563A4">EXECUTION &amp; STORAGE</text>
  <text x="1254" y="308" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="600" fill="#142B40">FHIR servers 1…N</text>
  <rect x="1255" y="335" width="268" height="42" rx="7" fill="#EDF4FB" stroke="#A9BFD4" stroke-width="1" />
  <text x="1268" y="362" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#142B40">FHIR server 1</text>
  <text x="1421" y="361" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#2563A4">Local index</text>
  <rect x="1255" y="390" width="268" height="42" rx="7" fill="#EDF4FB" stroke="#A9BFD4" stroke-width="1" />
  <text x="1268" y="417" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#142B40">FHIR server 2</text>
  <text x="1421" y="416" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#2563A4">Local index</text>
  <rect x="1255" y="445" width="268" height="42" rx="7" fill="#EDF4FB" stroke="#A9BFD4" stroke-width="1" />
  <text x="1268" y="472" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#142B40">FHIR server N</text>
  <text x="1421" y="471" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#2563A4">Local index</text>
  <text x="1256" y="529" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#41596C">Each shard writes, indexes and</text>
  <text x="1256" y="554" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#41596C">searches its own FHIR data.</text>
  <text x="1256" y="585" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#2563A4">128 TB × N nominal DB capacity</text>
  <polyline points="1311,711 1311,609" stroke="#087970" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" />
  <polygon points="1311.00,609.00 1315.62,617.87 1306.38,617.87" fill="#087970" />
  <polyline points="1458,605 1458,707" stroke="#087970" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" />
  <polygon points="1458.00,707.00 1453.38,698.13 1462.62,698.13" fill="#087970" />
  <text x="1257" y="671" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#087970">Input</text>
  <text x="1471" y="671" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#087970">Files</text>
  <rect x="1235" y="712" width="310" height="109" rx="12" fill="#EFF9F6" stroke="#087970" stroke-width="1.5" />
  <text x="1256" y="743" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#087970">BULK FILES</text>
  <text x="1255" y="781" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="600" fill="#142B40">Object storage</text>
  <text x="1256" y="805" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#41596C">Staged inputs and shard outputs</text>
  <polyline points="55,714 1070,714" stroke="#CBD7DF" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" />
  <text x="55" y="746" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#865B1C">HOW PLACEMENT CHANGES A QUERY</text>
  <text x="55" y="781" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="600" fill="#142B40">A known partition can narrow the search to one shard.</text>
  <text x="55" y="816" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#41596C">If the catalog cannot rule out matches elsewhere, the broker searches all participating shards.</text>
  <polyline points="55,851 1545,851" stroke="#CBD7DF" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" />
  <text x="55" y="880" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#41596C">Logical architecture  /  proposed federation capabilities</text>
  <text x="1163" y="880" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#41596C">Bulk file transfers do not pass through the query broker.</text>
</svg>