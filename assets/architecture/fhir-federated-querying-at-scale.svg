<?xml version='1.0' encoding='utf-8'?>
<svg aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
  <title id="title">One query across N independently indexed FHIR servers</title>
  <desc id="desc">A client sends a unified FHIR search to a fan-out broker. The broker queries multiple independent FHIR servers and combines their results. Each server has its own index and a modeled 128-terabyte capacity. The client can access data directly on each shard or partition by following the resource fullUrl. N times 128 terabytes is nominal aggregate capacity.</desc>
  <rect x="0" y="0" width="1600" height="900" fill="#F8FAFC" />
  <text x="60" y="49" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#41596C">AZURE HEALTH DATA SERVICES     /     FEDERATED FHIR</text>
  <rect x="1336" y="29" width="204" height="36" rx="18" fill="#EAF1F5" stroke="#A9BBC7" stroke-width="1" />
  <text x="1362" y="53" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#142B40">DESIGN CONCEPT</text>
  <text x="58" y="126" font-family="Segoe UI,Arial,sans-serif" font-size="47" font-weight="600" fill="#142B40">One query. N independently indexed FHIR servers.</text>
  <text x="60" y="170" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#41596C">A shared search experience across separate FHIR stores—not one giant database.</text>
  <polyline points="60,199 1540,199" stroke="#CBD7DF" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <text x="60" y="234" font-family="Consolas,monospace" font-size="15" font-weight="400" fill="#41596C">01</text>
  <text x="94" y="234" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#142B40">CLIENT</text>
  <text x="475" y="234" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#142B40">UNIFIED SEARCH</text>
  <text x="1015" y="234" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#142B40">INDEPENDENT SERVERS</text>
  <polyline points="310,373 439,373" stroke="#2563A4" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <polygon points="439.00,373.00 429.24,378.08 429.24,367.92" fill="#2563A4" />
  <polyline points="780,373 858,373 858,318 1003,318" stroke="#2563A4" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
