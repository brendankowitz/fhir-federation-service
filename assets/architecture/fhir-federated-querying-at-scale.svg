  <polyline points="185,518 185,653 1247,653 1247,623" stroke="#725596" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" />
  <polygon points="1247.00,623.00 1252.08,632.76 1241.92,632.76" fill="#725596" />
  <rect x="60" y="298" width="250" height="220" rx="14" fill="#F1F7FD" stroke="#2563A4" stroke-width="1.5" />
  <text x="83" y="335" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#2563A4">SEMI-INTELLIGENT CLIENT</text>
  <text x="82" y="381" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="600" fill="#142B40">FHIR client</text>
  <text x="83" y="419" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#41596C">Uses the broker for</text>
  <text x="83" y="445" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#41596C">unified search across</text>
  <text x="83" y="471" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#41596C">the participating shards.</text>
  <text x="83" y="504" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#2563A4">Can access shard data directly.</text>
  <rect x="440" y="290" width="340" height="250" rx="14" fill="#F7F3FB" stroke="#725596" stroke-width="1.5" />
  <text x="465" y="329" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#725596">ASSISTED FAN-OUT</text>
  <text x="463" y="375" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="600" fill="#142B40">Federation broker</text>
  <polyline points="466,399 752,399" stroke="#DDD3E8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <text x="465" y="435" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#41596C">Sends searches across N shards</text>
  <text x="465" y="467" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#41596C">Combines matching results</text>
  <text x="465" y="499" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#41596C">Returns one federated searchset</text>
  <text x="328" y="358" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#2563A4">search</text>
  <text x="824" y="354" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#2563A4">fan out</text>
  <text x="803" y="430" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#087970">merge results</text>
  <text x="368" y="643" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#725596">Client follows fullUrl for direct shard / partition access</text>
  <rect x="1015" y="263" width="465" height="110" rx="12" fill="#FFFFFF" stroke="#2563A4" stroke-width="1.5" />
  <rect x="1031" y="290" width="38" height="38" rx="9" fill="#EAF2FA" stroke="#2563A4" stroke-width="1" />
  <text x="1044" y="316" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#2563A4">01</text>
  <text x="1088" y="300" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#142B40">FHIR server 01</text>
  <text x="1088" y="329" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#41596C">Own FHIR API  ·  independent index</text>
  <text x="1088" y="354" font-family="Consolas,monospace" font-size="15" font-weight="600" fill="#2563A4">128 TB  /  SHARD</text>
  <rect x="1015" y="388" width="465" height="110" rx="12" fill="#FFFFFF" stroke="#2563A4" stroke-width="1.5" />
  <rect x="1031" y="415" width="38" height="38" rx="9" fill="#EAF2FA" stroke="#2563A4" stroke-width="1" />
  <text x="1044" y="441" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#2563A4">02</text>
  <text x="1088" y="425" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#142B40">FHIR server 02</text>
  <text x="1088" y="454" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#41596C">Own FHIR API  ·  independent index</text>
  <text x="1088" y="479" font-family="Consolas,monospace" font-size="15" font-weight="600" fill="#2563A4">128 TB  /  SHARD</text>
  <rect x="1015" y="513" width="465" height="110" rx="12" fill="#FFFFFF" stroke="#2563A4" stroke-width="1.5" />
  <rect x="1031" y="540" width="38" height="38" rx="9" fill="#EAF2FA" stroke="#2563A4" stroke-width="1" />
  <text x="1044" y="566" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#2563A4">N</text>
  <text x="1088" y="550" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#142B40">FHIR server N</text>
  <text x="1088" y="579" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#41596C">Own FHIR API  ·  independent index</text>
  <text x="1088" y="604" font-family="Consolas,monospace" font-size="15" font-weight="600" fill="#2563A4">128 TB  /  SHARD</text>
  <polyline points="60,692 1540,692" stroke="#CBD7DF" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <text x="60" y="727" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#2563A4">HORIZONTAL INDEXED CAPACITY</text>
  <text x="60" y="775" font-family="Segoe UI,Arial,sans-serif" font-size="41" font-weight="600" fill="#142B40">128 TB × N</text>
  <text x="60" y="810" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#41596C">modeled index / database capacity per FHIR server</text>
  <polyline points="665,716 665,848" stroke="#CBD7DF" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <text x="710" y="727" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#087970">AT EIGHT SHARDS</text>
  <text x="710" y="775" font-family="Segoe UI,Arial,sans-serif" font-size="41" font-weight="600" fill="#087970">1.024 PB</text>
  <text x="710" y="810" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#41596C">nominal aggregate indexed capacity</text>
  <text x="710" y="837" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#41596C">Illustrative capacity math—not a claim about usable payload, query latency or throughput.</text>
  <polyline points="60,870 1540,870" stroke="#CBD7DF" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <text x="60" y="891" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#41596C">Unified querying  /  independent FHIR APIs, indexes and storage</text>
  <text x="1378" y="891" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#41596C">PROPOSED</text>
</svg>