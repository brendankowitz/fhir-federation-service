  <polyline points="858,373 858,568 1003,568" stroke="#2563A4" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <polygon points="1003.00,568.00 993.24,573.08 993.24,562.92" fill="#2563A4" />
  <polyline points="1003,340 915,340 915,405 780,405" stroke="#087970" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <polygon points="780.00,405.00 789.76,399.92 789.76,410.08" fill="#087970" />
  <polyline points="1003,465 915,465 915,405" stroke="#087970" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
