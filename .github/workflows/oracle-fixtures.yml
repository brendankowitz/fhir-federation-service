name: Oracle fixtures

on:
  pull_request:
    paths:
      - 'test/fixtures/federation-oracle/**'
      - '.github/workflows/oracle-fixtures.yml'
  push:
    branches:
      - main
    paths:
      - 'test/fixtures/federation-oracle/**'
      - '.github/workflows/oracle-fixtures.yml'

permissions:
  contents: read

jobs:
  check-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -B test/fixtures/federation-oracle/check_fixtures.py
