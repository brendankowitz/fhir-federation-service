name: Oracle fixtures

on:
  pull_request:
    paths:
      - 'test/fixtures/federation-oracle/**'
      - '.github/workflows/oracle-fixtures.yml'
  push:
    branches:
      - main
    paths:
      - 'test/fixtures/federation-oracle/**'
      - '.github/workflows/oracle-fixtures.yml'

permissions:
  contents: read

jobs:
  check-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: python3 -B test/fixtures/federation-oracle/check_fixtures.py
