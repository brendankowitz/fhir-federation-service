name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Ignixa.Federation.slnx

      - name: Build
        run: dotnet build Ignixa.Federation.slnx -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test --solution Ignixa.Federation.slnx -c Release --no-build

      - name: Pack and check LICENSE in packages
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          for project in src/Ignixa.Federation.Core src/Ignixa.Federation.Shards; do
            dotnet pack "$project" -c Release --no-build -o artifacts/packages
          done
          for package in artifacts/packages/*.nupkg; do
            if ! unzip -l "$package" | grep -qE '\sLICENSE$'; then
              echo "::error::$package has no LICENSE at the package root"
              exit 1
            fi
          done

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: ghcr.io/brendankowitz/ignixa-federation:local

      - name: Check LICENSE is in the image
        run: docker run --rm --entrypoint /bin/sh ghcr.io/brendankowitz/ignixa-federation:local -c 'test -s /app/LICENSE'

      - name: Start compose stack
        run: docker compose -f deploy/compose.yaml up -d --no-build

      - name: Wait for liveness and readiness
        run: |
          set -u
          for endpoint in live ready; do
            url="http://127.0.0.1:5201/health/$endpoint"
            ok=false
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error --max-time 5 "$url" > /dev/null; then
                echo "$url is healthy (attempt $attempt)"
                ok=true
                break
              fi
              sleep 2
            done
            if [ "$ok" != true ]; then
              echo "::error::$url did not become healthy within 30 attempts"
              exit 1
            fi
          done

      - name: Show compose logs
        if: failure()
        run: docker compose -f deploy/compose.yaml logs

      - name: Tear down compose stack
        if: always()
        run: docker compose -f deploy/compose.yaml down --volumes --remove-orphans
