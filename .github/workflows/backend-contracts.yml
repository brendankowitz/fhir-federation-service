name: Backend contracts

on:
  push:
    branches: [main]
    paths:
      - 'test/Ignixa.Federation.Tests.BackendContracts/**'
      - '.github/workflows/backend-contracts.yml'
  pull_request:
    branches: [main]
    paths:
      - 'test/Ignixa.Federation.Tests.BackendContracts/**'
      - '.github/workflows/backend-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

concurrency:
  group: backend-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-search:
    name: Reference search (Microsoft FHIR Server R4 on SQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 11.0.100

      - name: Run offline evidence tests
        run: >-
          dotnet run --project test/Ignixa.Federation.Tests.BackendContracts/Ignixa.Federation.Tests.BackendContracts.csproj
          --configuration Release -- --show-live-output on --progress off --fail-skips on
          --filter-class '*EvidenceTests' --minimum-expected-tests 252

      - name: Run live Docker contracts
        run: >-
          dotnet run --project test/Ignixa.Federation.Tests.BackendContracts/Ignixa.Federation.Tests.BackendContracts.csproj
          --configuration Release --no-build -- --show-live-output on --progress off --fail-skips on
          --filter-class '*ContractTests' --minimum-expected-tests 31
