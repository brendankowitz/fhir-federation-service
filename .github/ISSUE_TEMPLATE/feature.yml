name: Feature request
description: Propose a change or addition to the federation.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what blocks you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The behaviour you want, including request and response shape where relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches and why they fall short.
  - type: input
    id: spec-section
    attributes:
      label: Spec section
      description: The section of the design spec this touches, if any.
      placeholder: "§7.5"
